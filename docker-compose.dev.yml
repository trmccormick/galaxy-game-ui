services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile.dev
    env_file:
      - './env/env.development'
    volumes:
      - ./galaxy-game-ui:/home/galaxy_game
      # map in various bash scripts
      - ./scripts:/home/galaxy_game/scripts
      # map in various persistent directories in the data folder
      - ./data/logs:/home/galaxy_game/log
      - ./data/bundle:/usr/local/bundle # cache bundle install
      - ./data/node_modules:/home/galaxy_game/node_modules
      # map in the imports folder (where CSV seeds are stored)
      - ./data/imports:/home/galaxy_game/data

    command: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - galaxy_game

  web:
    extends: app
    container_name: galaxy_game
    command: bash -c "bundle install && bash scripts/startup.sh"
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - galaxy_game 

  db:
    container_name: db
    image: postgres:16-alpine
    ports:
      - "5432"
    env_file:
      - './env/env.db'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - galaxy_game

networks:
  galaxy_game:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-galaxy_game
